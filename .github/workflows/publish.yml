name: Publish & Smoke-Test gio-macos-builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ghcr.io/chris533/gio-macos-builder:test
          load: true
          provenance: false

      - name: Smoke-test Universal macOS (.app / .zip / .dmg) build on Gio + explorer CGO app
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/examples/smoke-gio:/workspace" \
            ghcr.io/chris533/gio-macos-builder:test \
            --name "SmokeGio" \
            --id "cc.atomo.smokegio" \
            --entry "." \
            --version "1.0.0"
          test -x examples/smoke-gio/dist/macos/SmokeGio.app/Contents/MacOS/SmokeGio
          test -f examples/smoke-gio/dist/macos/SmokeGio.app/Contents/Resources/AppIcon.icns
          test -f examples/smoke-gio/dist/macos/SmokeGio-macOS-Universal.zip
          test -f examples/smoke-gio/dist/macos/SmokeGio-macOS-Universal.dmg
          file examples/smoke-gio/dist/macos/SmokeGio.app/Contents/MacOS/SmokeGio | grep -q "Mach-O universal binary with 2 architectures"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ghcr.io/chris533/gio-macos-builder (:15.5 & :latest)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: |
            ghcr.io/chris533/gio-macos-builder:15.5
            ghcr.io/chris533/gio-macos-builder:latest
          push: true
          provenance: false
